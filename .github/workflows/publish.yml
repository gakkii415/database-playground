name: Test and publish database playground
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: database-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for legacy Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            // repository-creator also enables the legacy branch-based Pages job.
            // Publish our built app last so that its assets remain the live site.
            for (let attempt = 0; attempt < 30; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                head_sha: context.sha, per_page: 100
              });
              const legacy = data.workflow_runs.filter(r => r.path === 'dynamic/pages/pages-build-deployment');
              if (legacy.length && legacy.every(r => r.status === 'completed')) return;
              if (!legacy.length && attempt >= 2) return;
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            core.setFailed('Legacy Pages deployment did not finish within 5 minutes.');
      - uses: actions/deploy-pages@v4
        id: deployment
